<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Jackpot Therapy</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/videophreak');

        :root {
            --btn-bg: #9d7fd5;
            --btn-shadow: rgb(136,0,255);
            --accent: #c19fff;
            --glow: rgb(144,0,255);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'videophreak', sans-serif;
            background: #0a0010;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background stars */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(144,0,255,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(100,0,200,0.1) 0%, transparent 50%);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: linear-gradient(160deg, #1a0030 0%, #3d0060 100%);
            border: 2px solid var(--btn-shadow);
            border-radius: 28px;
            padding: 50px 60px;
            width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            box-shadow: 0 0 60px rgba(136,0,255,0.4);
        }

        .logo { font-size: 48px; animation: floatLogo 3s ease-in-out infinite; }

        @keyframes floatLogo {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        h1 {
            font-family: 'videophreak', sans-serif;
            font-size: 36px;
            color: var(--accent);
            text-shadow: 0 0 20px var(--glow);
            text-align: center;
            animation: glowPulse 2.5s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%,100% { text-shadow: 0 0 20px var(--glow); }
            50%      { text-shadow: 0 0 50px var(--glow), 0 0 90px var(--glow); }
        }

        .form-group { width: 100%; display: flex; flex-direction: column; gap: 8px; }

        label {
            font-family: 'videophreak', sans-serif;
            font-size: 16px;
            color: var(--accent);
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 18px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(157,127,213,0.5);
            border-radius: 12px;
            color: #fff;
            font-family: 'videophreak', sans-serif;
            font-size: 18px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 16px rgba(193,159,255,0.4);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--btn-bg);
            color: #fff;
            border: 3px solid #000;
            border-radius: 14px;
            font-family: 'videophreak', sans-serif;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 1px 1px 12px var(--btn-shadow);
            transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
            margin-top: 8px;
        }

        .btn:hover {
            background: #b48ee8;
            transform: scale(1.04);
            box-shadow: 2px 2px 22px var(--btn-shadow);
        }

        .btn:active { transform: scale(0.96); }

        .errors {
            width: 100%;
            background: rgba(255,0,0,0.15);
            border: 1px solid #f66;
            border-radius: 10px;
            padding: 10px 14px;
            color: #f99;
            font-size: 14px;
            font-family: sans-serif;
        }

        .footer-links {
            font-family: sans-serif;
            font-size: 14px;
            color: rgba(193,159,255,0.6);
            text-align: center;
        }

        .footer-links a {
            color: var(--accent);
            text-decoration: none;
        }

        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">🎰</div>
    <h1>Jackpot Therapy</h1>

    <form method="post" style="width:100%; display:flex; flex-direction:column; gap:18px;">
        {% csrf_token %}

        {% if form.errors %}
        <div class="errors">
            Invalid username or password. Please try again.
        </div>
        {% endif %}

        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" id="id_username" name="username" autofocus autocomplete="username">
        </div>

        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" id="id_password" name="password" autocomplete="current-password">
        </div>

        <button type="submit" class="btn">LOG IN</button>
    </form>

    <div class="footer-links">
        No account? <a href="{% url 'signup' %}">Sign Up</a>
    </div>
</div>
</body>
</html>
