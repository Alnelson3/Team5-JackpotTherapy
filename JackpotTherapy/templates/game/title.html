<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackpot Therapy</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/game.css' %}">
</head>
<body>

<div class="screen" id="screen-title">
    <div class="title-screen-container">
        <h1 class="title"><strong>Jackpot Therapy</strong></h1>
        <p class="subtitle">Fortune Machine</p>

        <div class="title-buttons">
            {% if user.is_authenticated %}
                <a href="{% url 'game' %}" class="btn-game title-play-btn">▶ PLAY</a>
                <a href="{% url 'quit_game' %}" class="btn-game btn-secondary" style="font-size:18px; padding:10px 30px;">Log Out</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn-game title-play-btn">PLAY NOW</a>
                <a href="{% url 'signup' %}" class="btn-game btn-secondary" style="font-size:18px; padding:10px 30px;">Sign Up</a>
            {% endif %}
        </div>
    </div>
</div>

</body>
</html>
