{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackpot-Therapy</title>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <style>
        @import url('https://fonts.cdnfonts.com/css/videophreak');
    </style>
</head>
<body>

    <!-- ===== BACKGROUND ===== -->
    <img src="{% static 'images/TitleScreen.jpg' %}" class="background" id="background" alt="Background">

    <!-- ===== AUDIO ===== -->
    <audio src="{% static 'sounds/music.mp3' %}" id="music" loop></audio>
    <audio src="{% static 'sounds/click.mp3' %}" id="clickSound"></audio>
    <audio src="{% static 'sounds/spin.mp3' %}" id="spinSound"></audio>
    <audio src="{% static 'sounds/jackpot.mp3' %}" id="jackpotSound"></audio>

    <!-- ===== UNIVERSAL BUTTON (always visible) ===== -->
    <button class="open nav-btn" id="backOrQuitButton">Quit</button>

    <!-- ============================================================ -->
    <!--  TITLE SCREEN                                                -->
    <!-- ============================================================ -->
    <div class="screen" id="screen-title">
        <div class="title-screen-container">
            <img src="{% static 'images/welcome-sign.png' %}" class="welcome-sign-img" alt="Welcome Sign">
            <h1 class="title" id="titleText"><strong>Jackpot Therapy</strong></h1>
            <p class="subtitle">Fortune Machine</p>
            <img src="{% static 'images/slot-machine.png' %}" class="slot-machine-img" alt="Slot Machine">
            <button class="open title-play-btn" id="startButton">PLAY NOW</button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!--  PROFILE SELECT SCREEN                                       -->
    <!-- ============================================================ -->
    <div class="screen" id="screen-profile-select" style="display:none;">
        <h1 class="screen-title" id="profileText">Select Profile</h1>
        <div class="profile-select-grid" id="profileGrid">
            <!-- createNew card -->
            <div class="profile-card" id="createNewProfile" data-index="0">
                <img src="{% static 'images/Avatars/createNew.png' %}" alt="Create New">
                <span>New Profile</span>
            </div>
            <!-- saved profile cards injected by JS -->
        </div>
        <!-- select button only shown when a card is highlighted -->
        <button class="open profile-confirm-btn" id="selectButton" style="display:none;">✔ Select</button>
    </div>

    <!-- ============================================================ -->
    <!--  AVATAR SELECT SCREEN                                        -->
    <!-- ============================================================ -->
    <div class="screen" id="screen-avatar-select" style="display:none;">
        <h1 class="screen-title">Select an Avatar</h1>
        <div class="avatar-carousel">
            <button class="open carousel-btn" id="selectLeftButton">＜</button>
            <div class="avatar-stage">
                <img src="{% static 'images/Avatars/10.png' %}" class="avatar-side left-avatar"  id="avatarSelectLeft"  alt="Left Avatar">
                <img src="{% static 'images/Avatars/1.png' %}"  class="avatar-center"            id="avatarSelectMid"   alt="Selected Avatar">
                <img src="{% static 'images/Avatars/2.png' %}"  class="avatar-side right-avatar" id="avatarSelectRight" alt="Right Avatar">
            </div>
            <button class="open carousel-btn" id="selectRightButton">＞</button>
        </div>
        <button class="open profile-confirm-btn" id="confirmAvatarButton">✔ Choose</button>
    </div>

    <!-- ============================================================ -->
    <!--  NAME ENTRY SCREEN                                           -->
    <!-- ============================================================ -->
    <div class="screen" id="screen-name-entry" style="display:none;">
        <h1 class="screen-title">Enter Your Name</h1>
        <div class="name-entry-box">
            <div class="name-input-wrapper">
                <input type="text" id="nameInput" class="name-input" placeholder="Your name..." maxlength="18" autocomplete="off">
            </div>
            <button class="open profile-confirm-btn" id="confirmNameButton">✔ Let's Go!</button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!--  MAIN GAME SCREEN                                            -->
    <!-- ============================================================ -->
    <div class="screen" id="screen-main" style="display:none;">

        <!-- HUD Top Bar -->
        <div class="hud-bar">
            <div class="hud-left">
                <img src="{% static 'images/Avatars/1.png' %}" class="hud-avatar" id="hudAvatar" alt="Player Avatar">
                <div class="hud-info">
                    <span class="hud-name"  id="profileName">Player</span>
                    <span class="hud-balance" id="balance">$1,000</span>
                </div>
            </div>
            <div class="hud-right">
                <span class="hud-debt" id="debtElement" style="display:none;">Debt: $<span id="debtNum">0</span></span>
                <button class="open theme-btn" id="themeButton">🎨</button>
            </div>
        </div>

        <!-- Slot Reels -->
        <div class="slot-stage">
            <div class="reel-wrapper">
                <div class="reel" id="reel1">
                    <img src="{% static 'images/Icons/1.png' %}" id="slot1" alt="Slot 1">
                </div>
                <div class="reel" id="reel2">
                    <img src="{% static 'images/Icons/2.png' %}" id="slot2" alt="Slot 2">
                </div>
                <div class="reel" id="reel3">
                    <img src="{% static 'images/Icons/3.png' %}" id="slot3" alt="Slot 3">
                </div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="game-controls">
            <button class="open bet-btn" id="betButton">↓ Bet: $<strong id="betAmount">100</strong> ↓</button>
            <button class="open spin-btn" id="spinButton">SPIN</button>
            <button class="open loan-btn" id="loanButton">Loan</button>
        </div>

        <!-- Bet Dropdown -->
        <div id="amountOptions" class="bet-dropdown" style="display:none;">
            <button class="open bet-opt-btn" id="bet10">$10</button>
            <button class="open bet-opt-btn" id="bet100">$100</button>
            <button class="open bet-opt-btn" id="bet1000">$1,000</button>
            <button class="open bet-opt-btn" id="betAll">ALL IN 🔥</button>
        </div>

        <!-- Win Flash Overlay -->
        <div id="winFlash" class="win-flash" style="display:none;"></div>

        <!-- Jackpot Banner -->
        <div id="jackpotBanner" class="jackpot-banner" style="display:none;">
            🎰 JACKPOT! 🎰
        </div>

        <!-- Theme Manager Panel -->
        <div id="themeManager" class="theme-panel" style="display:none;">
            <h2 class="theme-panel-title">Theme</h2>
            <button class="open theme-opt-btn" id="themePurple">💜 Purple</button>
            <button class="open theme-opt-btn" id="themeBlue">💙 Blue</button>
            <button class="open theme-opt-btn" id="themeDark">🖤 Dark</button>
            <button class="open theme-opt-btn" id="themeGold">💛 Gold</button>
            <button class="open theme-opt-btn" id="closeThemeManager">✕ Close</button>
        </div>

    </div>

    <!-- ============================================================ -->
    <!--  LOSE SCREEN (overlay)                                       -->
    <!-- ============================================================ -->
    <div id="loseScreen" class="lose-overlay" style="display:none;">
        <div class="lose-card">
            <div class="lose-icon">💸</div>
            <h1 class="lose-title">You're Broke!</h1>
            <p class="lose-sub">Out of money and in debt.<br>Better luck next time.</p>
            <button class="open lose-btn" id="loseRestartButton">🔄 Play Again</button>
            <button class="open lose-btn lose-btn-secondary" id="loseQuitButton">🏠 Main Menu</button>
        </div>
    </div>

</body>
</html>
